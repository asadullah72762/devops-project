

services:

  webapp:
    build: ./app
    container_name: mera-devops-app
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - devops-network

  nginx:
    image: nginx:alpine
    container_name: mera-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapp
    restart: unless-stopped
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge
